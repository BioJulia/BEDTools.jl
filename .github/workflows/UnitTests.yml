name: Unit Tests

on:
  push:
    branches:
      - master
      - develop
      - release/*
      - hotfix/*
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        # 1.12 is the oldest version that BEDTools.jl supports, which workspaces need, to resolve the package, tests and docs together.
        julia-version: ['1.12', '1']
        # BEDTools_jll provides no `bedtools` for Windows, where the tests skip with a warning.
        os: [ubuntu-latest, macos-latest, windows-latest]
        experimental: [false]
        include:
          # Nightly is experimental, so it may fail without failing CI.
          - julia-version: nightly
            os: ubuntu-latest
            experimental: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
      - name: Cache Julia Packages
        uses: julia-actions/cache@v3
      - name: Run Tests
        uses: julia-actions/julia-runtest@v1
      # Coverage of one job is enough.
      - name: Create CodeCov
        if: matrix.julia-version == '1' && matrix.os == 'ubuntu-latest'
        uses: julia-actions/julia-processcoverage@v1
      - name: Upload CodeCov
        if: matrix.julia-version == '1' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          files: ./lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
